[project]
name = "homebase-template-studio"
version = "0.0.0"
description = "Homebase Template Studio (internal)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pypdf[crypto]>=6.20.0",
    "pypdfium2>=5.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette 1.7's TestClient prefers httpx2; httpx is the reviewed dev client
    # here until a dependency change is approved.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]
